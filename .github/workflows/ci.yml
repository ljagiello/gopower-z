name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs on every pull request and every push to main:
#   - go vet + go test (race detector) on Linux amd64/arm64 and macOS
#   - golangci-lint
#   - fuzzing of every parser of untrusted meter / USB-PD data
#   - actionlint (GitHub Actions workflow syntax and shellcheck)
#
# Documentation-only changes (docs/, site/, *.md, Vercel config, issue
# templates, LICENSE) skip all of the above; only "docs are HTML only" runs.
# The skipped jobs still report success, which is what the ruleset's required
# checks need. Matrix jobs skip their steps rather than the whole job, because
# a skipped matrix job reports under its unexpanded name and the required
# per-OS checks would never arrive. If change detection fails, everything runs.
jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
          fi
          # Files that are not documentation. grep -v without -q, so a SIGPIPE
          # under pipefail can never be mistaken for "nothing else changed".
          other=$(printf '%s\n' "$files" |
            grep -vE '^(docs/|site/|\.github/ISSUE_TEMPLATE/)|\.md$|^(vercel\.json|\.vercelignore|LICENSE)$' || true)
          code=true
          if [ -n "$files" ] && [ -z "$other" ]; then code=false; fi
          printf 'changed files:\n%s\n\ncode=%s\n' "$files" "$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: go vet + go test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - name: Documentation-only change
        if: env.RUN != 'true'
        run: echo "Only documentation changed; Go checks skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version-file: go.mod

      - name: Install libusb (Linux)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config

      - name: Install libusb (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: brew install libusb pkgconf

      - name: gofmt
        if: env.RUN == 'true'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        if: env.RUN == 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - if: env.RUN == 'true'
        run: go vet ./...
      - if: env.RUN == 'true'
        run: go test -race -count=1 ./...
      - if: env.RUN == 'true'
        run: go build -trimpath -o powerz ./cmd/powerz

      - name: Smoke test (no meter attached)
        if: env.RUN == 'true'
        run: |
          ./powerz version --json
          ./powerz schema > schema.json
          python3 -c 'import json; d=json.load(open("schema.json")); assert d["schema_version"] >= 1; print(len(d["commands"]), "commands")'
          set +e
          ./powerz read --json 2> err.json
          code=$?
          set -e
          cat err.json
          # No meter on CI runners: expect not_found (3) or permission_denied (6).
          test "$code" = 3 -o "$code" = 6

  lint:
    name: golangci-lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  fuzz:
    name: fuzz (untrusted input)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
      - name: Fuzz every target
        # Seed corpora (captured meter frames) already run in `go test`; this
        # explores beyond them. Crashers are uploaded below for reproduction.
        run: ./scripts/fuzz.sh 15s
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"

  actionlint:
    name: actionlint (workflow syntax)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run actionlint
        # shellcheck is preinstalled on ubuntu runners; actionlint uses it for run: scripts.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  docs:
    name: docs are HTML only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No Markdown in docs/
        run: |
          stray=$(git ls-files 'docs/*.md' 'docs/**/*.md')
          if [ -n "$stray" ]; then echo "::error::docs must be HTML, found: $stray"; exit 1; fi
