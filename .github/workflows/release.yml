name: Release

# Push a tag like v0.1.0 to build binaries on native runners (cgo + libusb),
# attach them to a GitHub release and publish build-provenance attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkgconf

      - run: go test -count=1 ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          name="powerz_${VERSION#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/$name/powerz" ./cmd/powerz
          cp LICENSE "dist/$name/"
          cp -R docs "dist/$name/docs"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
