version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115 # integer conversions are intentional when decoding protocol fields
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
